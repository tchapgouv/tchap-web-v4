name: Docker
on:
  workflow_dispatch: {}
  push:
    tags: [v*]
  pull_request: {}
  schedule:
    # Ce job peut prendre du temps, donc on ne publie que 2 fois par jour sur develop
    - cron: "0 7/12 * * *"

concurrency: ${{ github.workflow }}-${{ github.ref_name }}

permissions: {}

jobs:
  buildx:
    name: Docker Buildx
    runs-on: ubuntu-24.04
    permissions:
      id-token: write   # nécessaire pour cosign avec OIDC
      packages: write   # nécessaire pour push GHCR
      contents: read

    steps:
      - name: Clone or update Tchap-infra repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.9.2
        if: github.event_name != 'pull_request'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      # Connexion à GHCR
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Debug - Check token permissions
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Repository owner: ${{ github.repository_owner }}"
          echo "Event name: ${{ github.event_name }}"
          echo "Ref name: ${{ github.ref_name }}"

      - name: Debug - Test GHCR authentication
        run: |
          echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin
          docker pull hello-world
          docker tag hello-world ghcr.io/${{ github.repository_owner }}/test-debug:latest
          docker push ghcr.io/${{ github.repository_owner }}/test-debug:latest || echo "Push failed as expected"

      # Génération des métadonnées Docker (normal & debug)
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5.8.0
        with:
          images: |
            ghcr.io/tchapgouv/test-debug
          bake-target: docker-metadata-action
          flavor: |
            latest=${{ contains(github.ref_name, '-rc.') && 'false' || 'auto' }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag

      - name: Docker meta (debug variant)
        id: meta-debug
        uses: docker/metadata-action@v5.8.0
        with:
          images: |
            ghcr.io/tchapgouv/test-debug
          bake-target: docker-metadata-action-debug
          flavor: |
            latest=auto
            suffix=-debug,onlatest=true
          tags: |
            type=ref,event=branch
            type=ref,event=tag

      - name: Build and load
        id: test-build
        uses: docker/bake-action@v6.8.0
        with:
          context: .
          load: true
          files: |
            ./docker-bake.hcl
            cwd://${{ steps.meta.outputs.bake-file }}
            cwd://${{ steps.meta-debug.outputs.bake-file }}

      - name: Docker meta (for push)
        id: meta-push
        uses: docker/metadata-action@v5.8.0
        if: github.event_name != 'pull_request'
        with:
          images: |
            ghcr.io/tchapgouv/test-debug
          flavor: |
            latest=${{ contains(github.ref_name, '-rc.') && 'false' || 'auto' }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag

      - name: Debug - Show generated metadata
        run: |
          echo "Generated tags: ${{ steps.meta-push.outputs.tags }}"
          echo "Generated labels: ${{ steps.meta-push.outputs.labels }}"

      - name: Build and push
        id: build-and-push
        uses: docker/bake-action@v6.8.0
        if: github.event_name != 'pull_request'
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta-push.outputs.tags }}
          labels: ${{ steps.meta-push.outputs.labels }}
          provenance: false
          sbom: false
          files: |
            ./docker-bake.hcl
            cwd://${{ steps.meta.outputs.bake-file }}
            cwd://${{ steps.meta-debug.outputs.bake-file }}

      - name: Sign the images with GitHub OIDC Token
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
          TAGS: ${{ steps.meta-push.outputs.tags }}
        run: |
          images=""
          for tag in ${TAGS}; do
            images+="${tag}@${DIGEST} "
          done
          cosign sign --yes ${images}
